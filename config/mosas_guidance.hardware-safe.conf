# 实机第一阶段安全验证配置：使用真实 Nori 相机，但不读取 IMU 串口，也不发送控制帧。

[camera]
device=/dev/video0
device_id=0
width=640
height=480
fps=120
pixel_format=MJPEG
auto_exposure=false
exposure_us=100
gain=0
callback_queue_capacity=2
mode=free_run
undistort=false
distortion_k1=0
distortion_k2=0
distortion_p1=0
distortion_p2=0
distortion_k3=0
matrix_m00=500
matrix_m01=0
matrix_m02=320
matrix_m10=0
matrix_m11=500
matrix_m12=240
matrix_m20=0
matrix_m21=0
matrix_m22=1

[imu]
mode=simulated
sample_rate_hz=500
skip_self_check=true

[command]
mode=log

[guidance]
launch_speed_mps=13
history_capacity=256
max_imu_age_ms=50
max_command_age_ms=0
control_watchdog_timeout_ms=0
processing_deadline_ms=0
capture_queue_capacity=1
output_queue_capacity=1
initial_roi_x=0
initial_roi_y=0
initial_roi_width=640
initial_roi_height=480
h_min=35
h_max=100
s_min=80
s_max=255
v_min=100
v_max=255
found_range_x=40
found_range_y=40
min_blob_area=8
min_aspect_ratio=0.5
min_fill_ratio=0.35
camera_fx=500
camera_fy=500
camera_cx=320
camera_cy=240
camera_to_body_m00=1
camera_to_body_m01=0
camera_to_body_m02=0
camera_to_body_m10=0
camera_to_body_m11=1
camera_to_body_m12=0
camera_to_body_m20=0
camera_to_body_m21=0
camera_to_body_m22=1
los_process_noise=0.01
los_measurement_noise=0.25
los_initial_covariance=1
los_enable_filter=false
png_navigation_constant_y=3
png_navigation_constant_z=3
png_gravity=9.80665
phase_min_static_samples=20
phase_min_static_duration_ms=100
phase_max_static_axis_variation=0.5
phase_launch_direction=1
phase_ejection_start_threshold=20
phase_ejection_confirm_duration_ms=1
phase_free_flight_release_threshold=3
phase_free_flight_confirm_duration_ms=1

[wireless]
enable_wireless_stream=false
enable_recording=false
draw_visualization=false
draw_vision_debug=false
