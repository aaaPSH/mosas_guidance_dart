# MOSAS 统一制导程序示例配置。
# 默认使用 Nori SDK 相机、模拟 IMU 和日志指令输出；真实设备接入前请确认 SDK 设备路径。

[camera]
# Nori SDK 设备索引；按 SDK 示例选择 0 号设备。
device_id=0
# 采集图像宽度，单位：像素。
width=640
# 采集图像高度，单位：像素。
height=480
# 采集帧率，单位：帧/秒。
fps=120
# Nori SDK 视频媒体类型：支持 MJPEG、YUYV，auto 表示选择 SDK 返回的首个支持格式。
pixel_format=MJPEG
# 是否启用 SDK 自动曝光；为 true 时忽略下面的手动曝光和增益配置。
auto_exposure=false
# SDK 手动曝光时间，单位：微秒；auto_exposure=true 时忽略。
exposure_us=5000
# SDK 传感器增益；auto_exposure=true 时忽略。
gain=0
# SDK 回调与处理线程之间的帧缓存容量；队列满时丢弃最旧帧。
callback_queue_capacity=2
# 采集模式：free_run 表示自由采集，hardware_trigger 表示硬件触发。
mode=free_run
# 是否启用去畸变；启用后使用下面的畸变系数处理每一帧图像。
undistort=false
# OpenCV 径向畸变系数 k1。
distortion_k1=0
# OpenCV 径向畸变系数 k2。
distortion_k2=0
# OpenCV 切向畸变系数 p1。
distortion_p1=0
# OpenCV 切向畸变系数 p2。
distortion_p2=0
# OpenCV 径向畸变系数 k3。
distortion_k3=0

# 相机内参矩阵 K，格式为行列下标 m[row][column]；通常 m00=fx、m11=fy、m02=cx、m12=cy。
# 内参矩阵第 0 行第 0 列。
matrix_m00=500
# 内参矩阵第 0 行第 1 列，通常为 0。
matrix_m01=0
# 内参矩阵第 0 行第 2 列，主点横坐标 cx。
matrix_m02=320
# 内参矩阵第 1 行第 0 列，通常为 0。
matrix_m10=0
# 内参矩阵第 1 行第 1 列，Y 方向焦距 fy。
matrix_m11=500
# 内参矩阵第 1 行第 2 列，主点纵坐标 cy。
matrix_m12=240
# 内参矩阵第 2 行第 0 列，通常为 0。
matrix_m20=0
# 内参矩阵第 2 行第 1 列，通常为 0。
matrix_m21=0
# 内参矩阵第 2 行第 2 列，通常为 1。
matrix_m22=1

[imu]
# IMU 数据源模式；当前支持 simulated。
mode=simulated
# 测试用：使用假基准跳过 IMU 静止自检。
skip_self_check=false
# 模拟 IMU 采样率，单位：Hz。
sample_rate_hz=200

[command]
# 制导指令输出模式；log 表示只打印日志，不连接飞控。
mode=log

[guidance]
# 飞行器初始速度，单位：m/s。
launch_speed_mps=13
# IMU 状态历史缓存容量。
history_capacity=256
# 图像允许匹配的最大 IMU 时间差，单位：毫秒。
max_imu_age_ms=50
# 摄像头采集队列容量。
capture_queue_capacity=1
# 处理结果输出队列容量。
output_queue_capacity=1

# 视觉识别参数。
# 初始 ROI 左上角 X 坐标，单位：像素。
initial_roi_x=0
# 初始 ROI 左上角 Y 坐标，单位：像素。
initial_roi_y=0
# 初始 ROI 宽度，单位：像素。
initial_roi_width=640
# 初始 ROI 高度，单位：像素。
initial_roi_height=480
# HSV 色调最小值，OpenCV 范围通常为 0～179。
h_min=35
# HSV 色调最大值，OpenCV 范围通常为 0～179。
h_max=85
# HSV 饱和度最小值，范围为 0～255。
s_min=80
# HSV 饱和度最大值，范围为 0～255。
s_max=255
# HSV 明度最小值，范围为 0～255。
v_min=100
# HSV 明度最大值，范围为 0～255。
v_max=255
# 检测到目标后 ROI 在 X 方向的扩展范围，单位：像素。
found_range_x=40
# 检测到目标后 ROI 在 Y 方向的扩展范围，单位：像素。
found_range_y=40
# 目标区域最小像素面积。
min_blob_area=8
# 目标短边/长边宽高比的最小值。
min_aspect_ratio=0.5
# 目标像素面积/外接矩形面积的最小值。
min_fill_ratio=0.35

# 相机到弹体的安装旋转矩阵。
# 旋转矩阵第 0 行第 0 列。
camera_to_body_m00=1
# 旋转矩阵第 0 行第 1 列。
camera_to_body_m01=0
# 旋转矩阵第 0 行第 2 列。
camera_to_body_m02=0
# 旋转矩阵第 1 行第 0 列。
camera_to_body_m10=0
# 旋转矩阵第 1 行第 1 列。
camera_to_body_m11=1
# 旋转矩阵第 1 行第 2 列。
camera_to_body_m12=0
# 旋转矩阵第 2 行第 0 列。
camera_to_body_m20=0
# 旋转矩阵第 2 行第 1 列。
camera_to_body_m21=0
# 旋转矩阵第 2 行第 2 列。
camera_to_body_m22=1

# 视线角速度滤波参数。
# 视线角速度 Kalman 过程噪声方差。
los_process_noise=0.01
# 视线角测量噪声方差。
los_measurement_noise=0.25
# 滤波器初始角速度协方差。
los_initial_covariance=1
# 是否启用视线角速度 Kalman 滤波。
los_enable_filter=true

# PNG 导引参数。
# 导航系数只作用于导航系 Y 方向（q_y 视线角速度）。
png_navigation_constant_y=3
# 导航系数只作用于导航系 Z 方向（q_z 视线角速度）。
png_navigation_constant_z=3
# 重力加速度，单位：m/s²。
png_gravity=9.80665

# 飞行阶段检测参数。
# 判定静止所需的最少 IMU 样本数。
phase_min_static_samples=20
# 判定静止所需的最短持续时间，单位：毫秒。
phase_min_static_duration_ms=100
# 静止阶段各加速度轴允许的最大变化量，单位：m/s²。
phase_max_static_axis_variation=0.5
# 发射方向，支持 1 或 -1。
phase_launch_direction=1
# 进入弹射阶段的加速度变化阈值，单位：m/s²。
phase_ejection_start_threshold=20
# 弹射状态确认持续时间，单位：毫秒。
phase_ejection_confirm_duration_ms=1
# 进入自由飞行阶段的加速度变化阈值，单位：m/s²。
phase_free_flight_release_threshold=3
# 自由飞行状态确认持续时间，单位：毫秒。
phase_free_flight_confirm_duration_ms=1

[wireless]
# 是否启用 RTSP 无线推流。
# 关闭无线推流不会关闭本地录像；可单独启用 enable_recording。
enable_wireless_stream=false
# 是否启用本地录像。
enable_recording=true
# 录像基础路径；相对路径相对于本配置文件目录，实际文件名会追加时间编号。
recording_path=recordings/mosas_guidance.avi
# 本地录像帧率，单位：帧/秒。
recording_fps=30
# 是否绘制识别框、视线角和制导数据。
draw_visualization=true
# RTSP 推流地址。
rtsp_url=rtsp://192.168.137.1:8554/mosas
# RTP 传输方式，支持 tcp 或 udp。
rtsp_transport=tcp
# RTSP 视频宽度，单位：像素。
width=640
# RTSP 视频高度，单位：像素。
height=480
# RTSP 输出帧率，单位：帧/秒。
fps=30
# H.264 视频码率，单位：bit/s。
bitrate=2000000
# GOP 长度，单位：帧。
gop_size=30
# RTSP 建连和网络 I/O 超时时间，单位：毫秒。
rtsp_timeout_ms=5000
# 可选的 FFmpeg H.264 编码器名称；不填写时使用默认编码器。
