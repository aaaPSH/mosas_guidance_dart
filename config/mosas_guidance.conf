# MOSAS 统一制导程序示例配置。
# 默认使用 Nori SDK 相机、模拟 IMU 和日志指令输出；真实设备接入前请确认 SDK 设备路径。

[camera]
# Nori SDK 设备索引；按 SDK 示例选择 0 号设备。
device_id=0
# 采集图像宽度，单位：像素。
width=640
# 采集图像高度，单位：像素。
height=480
# 采集帧率，单位：帧/秒。
fps=120
# Nori SDK 视频媒体类型：支持 MJPEG、YUYV，auto 表示选择 SDK 返回的首个支持格式。
pixel_format=MJPEG
# 是否启用 SDK 自动曝光；为 true 时忽略下面的手动曝光和增益配置。
auto_exposure=false
# SDK 手动曝光时间，单位：微秒；auto_exposure=true 时忽略。
exposure_us=500
# SDK 传感器增益；auto_exposure=true 时忽略。
gain=1
# SDK 回调与处理线程之间的帧缓存容量；队列满时丢弃最旧帧。
callback_queue_capacity=2
# Frame_Time 时钟域：必须按设备/驱动验证；可选 realtime、monotonic、unknown。
frame_timestamp_domain=realtime
# SDK 采集时刻到曝光参考时刻的固定修正，单位纳秒。
camera_timestamp_bias_ns=-2000000
# 采集模式：free_run 表示自由采集，hardware_trigger 表示硬件触发。
mode=free_run
# 相机内参矩阵 K，格式为行列下标 m[row][column]；通常 m00=fx、m11=fy、m02=cx、m12=cy。
# 内参矩阵第 0 行第 0 列。
matrix_m00=486.244430986463
# 内参矩阵第 0 行第 1 列，通常为 0。
matrix_m01=0
# 内参矩阵第 0 行第 2 列，主点横坐标 cx。
matrix_m02=308.810501121211
# 内参矩阵第 1 行第 0 列，通常为 0。
matrix_m10=0
# 内参矩阵第 1 行第 1 列，Y 方向焦距 fy。
matrix_m11=486.544705399672
# 内参矩阵第 1 行第 2 列，主点纵坐标 cy。
matrix_m12=244.693205492819
# 内参矩阵第 2 行第 0 列，通常为 0。
matrix_m20=0
# 内参矩阵第 2 行第 1 列，通常为 0。
matrix_m21=0
# 内参矩阵第 2 行第 2 列，通常为 1。
matrix_m22=1

[imu]
# IMU 数据源模式；支持 simulated 和 serial。
mode=serial
# IMU 实际发送频率配置，单位：Hz；时间戳不再用名义周期重建。
sample_rate_hz=200
# 下位机测量时刻相对串口帧时间的固定延迟，单位纳秒；需实测后填写。
measurement_latency_ns=0
# 串口接收线程请求的 SCHED_FIFO 优先级，0 表示不请求实时调度。
receive_realtime_priority=20
# 生产部署要求实时优先级申请失败时拒绝启动；开发机可改为 false。
require_realtime_priority=true

[command]
# 制导指令输出模式；log 表示只打印日志，serial 表示向下位机发送控制帧。
mode=serial

[serial]
# 当 imu.mode=serial 或 command.mode=serial 时使用；请改为实际下位机串口设备。
device=/dev/ttyS3
# 串口波特率。
baud_rate=115200
# 数据位，支持 5～8。
data_bits=8
# 停止位，支持 1 或 2。
stop_bits=1
# 校验方式，支持 none、even、odd。
parity=none
# 流控方式，支持 none、software、hardware。
flow_control=none
# 串口 IMU 单次读取超时，单位：毫秒；会按 IMU 发送周期自动取更小值。
read_timeout_ms=100
# 下行控制帧写超时，单位：毫秒。
write_timeout_ms=100
# 是否在程序退出时输出 IMU 数据帧间隔统计摘要。
enable_interval_statistics=false

[guidance]
# 飞行器初始速度，单位：m/s。
launch_speed_mps=13
# IMU 状态历史缓存容量。
history_capacity=256
# 图像允许匹配的最大 IMU 时间差，单位：毫秒。
max_imu_age_ms=50
# 相机 Frame_Time 允许超前主机接收时间的最大值，单位：毫秒。
max_camera_future_ms=50
# 相机 Frame_Time 允许落后主机接收时间的最大值，单位：毫秒。
max_camera_age_ms=2000
# 摄像头采集队列容量。
capture_queue_capacity=1
# 处理结果输出队列容量。
output_queue_capacity=1

# 视觉识别参数。
# 初始 ROI 左上角 X 坐标，单位：像素。
initial_roi_x=0
# 初始 ROI 左上角 Y 坐标，单位：像素。
initial_roi_y=0
# 初始 ROI 宽度，单位：像素。
initial_roi_width=640
# 初始 ROI 高度，单位：像素。
initial_roi_height=480
# HSV 色调最小值，OpenCV 范围通常为 0～179。
h_min=35
# HSV 色调最大值，OpenCV 范围通常为 0～179。
h_max=100
# HSV 饱和度最小值，范围为 0～255。
s_min=80
# HSV 饱和度最大值，范围为 0～255。
s_max=255
# HSV 明度最小值，范围为 0～255。
v_min=100
# HSV 明度最大值，范围为 0～255。
v_max=255
# 检测到目标后 ROI 在 X 方向的扩展范围，单位：像素。
found_range_x=40
# 检测到目标后 ROI 在 Y 方向的扩展范围，单位：像素。
found_range_y=40
# 目标区域最小像素面积。
min_blob_area=1
# 目标短边/长边宽高比的最小值。
min_aspect_ratio=0.5
# 目标像素面积/外接矩形面积的最小值。
min_fill_ratio=0.35

# 图像链路已将倒装相机旋转 180 度，外参使用单位矩阵。
# 旋转矩阵第 0 行第 0 列。
camera_to_body_m00=1
# 旋转矩阵第 0 行第 1 列。
camera_to_body_m01=0
# 旋转矩阵第 0 行第 2 列。
camera_to_body_m02=0
# 旋转矩阵第 1 行第 0 列。
camera_to_body_m10=0
# 旋转矩阵第 1 行第 1 列。
camera_to_body_m11=1
# 旋转矩阵第 1 行第 2 列。
camera_to_body_m12=0
# 旋转矩阵第 2 行第 0 列。
camera_to_body_m20=0
# 旋转矩阵第 2 行第 1 列。
camera_to_body_m21=0
# 旋转矩阵第 2 行第 2 列。
camera_to_body_m22=1

# 视线角速度滤波参数（二状态恒角速度 Kalman 滤波 + Gyro 已知输入）。
# 综合角加速度过程噪声标准差，单位：rad/s²。
los_kalman_sigma_a=8.0
# 俯仰通道过程噪声标准差（<=0 时回退使用 los_kalman_sigma_a）。
los_kalman_sigma_a_pitch=10.0
# 偏航通道过程噪声标准差（<=0 时回退使用 los_kalman_sigma_a）。
los_kalman_sigma_a_yaw=3.5
# 视线角测量噪声标准差，单位：rad（对应约 2px 视差）。
los_kalman_sigma_q=0.0035
# 滤波器初始角速度协方差，单位：(rad/s)²。
los_initial_covariance=1.0
# 是否启用视线角速度 Kalman 滤波。
los_enable_filter=true

# 姿态维护与起飞检测参数。
# 静止判定和起飞前低比力保护使用的加速度模长相对重力最大偏差，单位：m/s²。
attitude_stationary_acceleration_tolerance_mps2=0.3
# 静止判定时角速度模长的最大值，单位：rad/s。
attitude_gyro_stationary_threshold_rad_s=0.2
# 静止阶段陀螺仪零偏 EMA 系数。
attitude_gyro_bias_filter_alpha=0.02
# 相对启动基线的 X 轴起飞加速度增量阈值，单位：m/s²（1.5g）。
launch_ax_threshold_mps2=14.709975
# x 轴加速度持续超过阈值的确认时间，单位：ms。
launch_confirm_ms=20
# true 表示加速度计输出为比力；false 表示输出为重力加速度方向。
accelerometer_specific_force=true

# PNG 导引参数。
# 导航系数作用于 LOS 空间角速度投影后的弹道系 Y 方向。
png_navigation_constant_y=3
# 导航系数作用于 LOS 空间角速度投影后的弹道系 Z 方向。
png_navigation_constant_z=3
# 重力加速度，单位：m/s²；同时用于姿态重力估计和 PNG 过载换算。
png_gravity=9.80665
# 弹道系 Y/Z 合成指令过载上限，单位：g。
png_maximum_command_overload=1
# 导航系 PNG 指令加速度模长上限，单位：m/s²。
png_maximum_command_acceleration=9.80665

[output]
# 输出模式互斥：rtsp 只推流，debug 连续保存，match 在起飞后缓存窗口并保存。
mode=match
# debug/match 的录像基础路径；相对路径相对于本配置文件目录。
# 每次程序运行会在同目录创建带时间编号的文件夹，存放本次所有视频、逐帧 CSV 和全程 IMU CSV。
# 路径为空时使用 recordings/mosas_guidance.avi。
recording_path=recordings/mosas_guidance.avi
# 是否在视频帧中绘制目标框、目标状态、视线角和制导数据。
draw_visualization=true
# 起飞窗口时长，单位：ms。默认 10 秒；帧率使用上方相机 fps，大小受 BGR 内存上限限制。
match_window_duration_ms=4000

[wireless]
# RTSP 推流地址。
rtsp_url=rtsp://192.168.137.1:8554/mosas
# RTP 传输方式，支持 tcp 或 udp。
rtsp_transport=tcp
# RTSP 视频宽度，单位：像素。
width=640
# RTSP 视频高度，单位：像素。
height=480
# RTSP 输出帧率，单位：帧/秒。
fps=30
# H.264 视频码率，单位：bit/s。
bitrate=2000000
# GOP 长度，单位：帧。
gop_size=30
# RTSP 建连和网络 I/O 超时时间，单位：毫秒。
rtsp_timeout_ms=5000
# 可选的 FFmpeg H.264 编码器名称；不填写时使用默认编码器。
