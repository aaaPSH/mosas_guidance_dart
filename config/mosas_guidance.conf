# MOSAS 场上运行默认配置；与 mosas_sync_calibration.conf 相互独立。
# 当前使用 Nori SDK 相机、串口 IMU 和周期串口指令输出；接入前请确认设备路径。

[app]
# 是否在退出时打印流水线与相机耗时统计。
enable_timing_statistics=false

[camera]
# Nori SDK 设备索引；按 SDK 示例选择 0 号设备。
device_id=0
# 采集图像宽度，单位：像素。
width=640
# 采集图像高度，单位：像素。
height=480
# 采集帧率，单位：帧/秒。
fps=120
# 实际触发/采集频率；允许非整数。独立于 SDK 视频模式 fps，用于固定序号时间轴。
sample_rate_hz=120
timestamp_warmup_ms=500
timestamp_stable_window_ms=200
timestamp_tolerance_ms=50
frequency_observation_window_ms=2000
# Nori SDK 视频媒体类型：支持 MJPEG、YUYV，auto 表示选择 SDK 返回的首个支持格式。
pixel_format=MJPEG
# 是否启用 SDK 自动曝光；为 true 时忽略下面的手动曝光和增益配置。
auto_exposure=false
# SDK 手动曝光时间，单位：微秒；auto_exposure=true 时忽略。
exposure_us=1000
# SDK 传感器增益；auto_exposure=true 时忽略。
gain=1
# SDK 回调与处理线程之间的帧缓存容量；队列满时丢弃最旧帧。
callback_queue_capacity=2
# Frame_Time 时钟域：必须按设备/驱动验证；可选 realtime、monotonic、unknown。
frame_timestamp_domain=realtime
# SDK 采集时刻到曝光参考时刻的固定修正，单位纳秒。
camera_timestamp_bias_ns=0
# 采集模式：free_run 表示自由采集，hardware_trigger 表示硬件触发。
mode=free_run
# 相机内参矩阵 K，格式为行列下标 m[row][column]；通常 m00=fx、m11=fy、m02=cx、m12=cy。
# 内参矩阵第 0 行第 0 列。
matrix_m00=486.244430986463
# 内参矩阵第 0 行第 1 列，通常为 0。
matrix_m01=0
# 内参矩阵第 0 行第 2 列，主点横坐标 cx。
matrix_m02=308.810501121211
# 内参矩阵第 1 行第 0 列，通常为 0。
matrix_m10=0
# 内参矩阵第 1 行第 1 列，Y 方向焦距 fy。
matrix_m11=486.544705399672
# 内参矩阵第 1 行第 2 列，主点纵坐标 cy。
matrix_m12=244.693205492819
# 内参矩阵第 2 行第 0 列，通常为 0。
matrix_m20=0
# 内参矩阵第 2 行第 1 列，通常为 0。
matrix_m21=0
# 内参矩阵第 2 行第 2 列，通常为 1。
matrix_m22=1

[imu]
# IMU 数据源模式；支持 simulated 和 serial。
mode=serial
# 标定后的实际采样频率，单位 Hz；固定序号时间轴使用此值，运行中不校频。
sample_rate_hz=1000
timestamp_warmup_ms=500
timestamp_stable_window_ms=200
timestamp_tolerance_ms=50
frequency_observation_window_ms=2000
# 下位机测量时刻相对串口帧时间的固定延迟，单位纳秒；需实测后填写。
measurement_latency_ns=0
# 串口接收线程请求的 SCHED_FIFO 优先级，0 表示不请求实时调度。
receive_realtime_priority=20
# 生产部署要求实时优先级申请失败时拒绝启动；开发机可改为 false。
require_realtime_priority=true

[command]
# 制导指令输出模式；log 按新结果打印日志，serial 从发送线程启动起周期发送控制帧。
mode=serial
# 串口发送频率，单位 Hz，允许 1～1000；独立于图像处理频率，始终采样最新结果。
send_rate_hz=100
# 新命令提交后可重复发送的最长时间，单位 ms；重发不续期，超时清零过载和识别位。
# 未发射时持续发送零过载；发射后超时仍保留发射标志，复位时清除。
command_timeout_ms=100

[serial]
# 当 imu.mode=serial 或 command.mode=serial 时使用；请改为实际下位机串口设备。
device=/dev/ttyS3
# 串口波特率。
baud_rate=921600
# 数据位，支持 5～8。
data_bits=8
# 停止位，支持 1 或 2。
stop_bits=1
# 校验方式，支持 none、even、odd。
parity=none
# 流控方式，支持 none、software、hardware。
flow_control=none
# 串口 IMU 单次读取超时，单位：毫秒；会按 IMU 发送周期自动取更小值。
read_timeout_ms=100
# 下行控制帧写超时，单位：毫秒。
write_timeout_ms=100
# 是否在程序退出时输出 IMU 数据帧间隔统计摘要。
enable_interval_statistics=false

[guidance]
# 唯一算法：曝光姿态与杆臂补偿、惯性系双通道角度滤波、弹道 PNG。
# 每次实际发送/重发前使用最新姿态映射，再选择 body 通道并限幅。
# both 双通道；pitch 仅 body-Y；yaw 仅 body-Z。修改后重启。
control_channel=both
# 公共角加速度过程噪声标准差，单位 rad/s²。
los_kalman_sigma_a=8.0
# 俯仰、方位通道过程噪声标准差；0 时使用公共值，单位 rad/s²。
los_kalman_sigma_a_pitch=10.0
los_kalman_sigma_a_yaw=3.5
# 补偿后惯性视线角测量噪声标准差，单位 rad。
los_kalman_sigma_q=0.0035
# 初始角速度方差，可为 0，单位 (rad/s)²。
los_initial_covariance=1.0
# 是否启用角度 Kalman 滤波；false 使用补偿后角度的帧间差分。
los_enable_filter=true
# 超过该帧间隔重建基准并提交无效零请求，单位 ms。
los_maximum_gap_ms=200
# 是否启用杆臂补偿；false 仅跳过杆臂修正，不影响姿态转换或角度滤波。
los_enable_lever_arm_compensation=true
# 相机相对机体原点(质心) X 轴杆臂，单位 m。
los_camera_lever_arm_x=0.10
# 连续段首个有效识别帧的弹目距离初值，单位 m；须为有限正数。
# 首帧不积分；后续按曝光同步速度梯形积分递减，最低 1 m；重建连续段时恢复初值。
los_estimated_target_distance=15

# 发射触发确认帧使用的标定速度初值，单位：m/s；触发前和确认帧不积分姿态/速度。
# 触发后按 V += (ax_imu - png_gravity * sin(pitch)) * dt 更新曝光时刻速度。
launch_speed_mps=16
# IMU 状态历史缓存容量。
history_capacity=256
# 历史匹配与发送端最新姿态允许的最大 IMU 年龄，单位 ms。
max_imu_age_ms=50
# 相机 Frame_Time 允许超前主机接收时间的最大值，单位：毫秒。
max_camera_future_ms=50
# 相机 Frame_Time 允许落后主机接收时间的最大值，单位：毫秒。
max_camera_age_ms=2000
# 摄像头采集队列容量。
capture_queue_capacity=1
# 处理结果输出队列容量。
output_queue_capacity=1

# 视觉识别参数。
# 初始 ROI 左上角 X 坐标，单位：像素。
initial_roi_x=0
# 初始 ROI 左上角 Y 坐标，单位：像素。
initial_roi_y=0
# 初始 ROI 宽度，单位：像素。
initial_roi_width=640
# 初始 ROI 高度，单位：像素。
initial_roi_height=480
# HSV 色调最小值，OpenCV 范围通常为 0～179。
h_min=35
# HSV 色调最大值，OpenCV 范围通常为 0～179。
h_max=100
# HSV 饱和度最小值，范围为 0～255。
s_min=80
# HSV 饱和度最大值，范围为 0～255。
s_max=255
# HSV 明度最小值，范围为 0～255。
v_min=100
# HSV 明度最大值，范围为 0～255。
v_max=255
# 检测到目标后 ROI 在 X 方向的扩展范围，单位：像素。
found_range_x=40
# 检测到目标后 ROI 在 Y 方向的扩展范围，单位：像素。
found_range_y=40
# 目标区域最小像素面积。
min_blob_area=1
# 目标短边/长边宽高比的最小值。
min_aspect_ratio=0.5
# 目标像素面积/外接矩形面积的最小值。
min_fill_ratio=0.35

# 图像链路已将倒装相机旋转 180 度，外参使用单位矩阵。
# 旋转矩阵第 0 行第 0 列。
camera_to_body_m00=1
# 旋转矩阵第 0 行第 1 列。
camera_to_body_m01=0
# 旋转矩阵第 0 行第 2 列。
camera_to_body_m02=0
# 旋转矩阵第 1 行第 0 列。
camera_to_body_m10=0
# 旋转矩阵第 1 行第 1 列。
camera_to_body_m11=1
# 旋转矩阵第 1 行第 2 列。
camera_to_body_m12=0
# 旋转矩阵第 2 行第 0 列。
camera_to_body_m20=0
# 旋转矩阵第 2 行第 1 列。
camera_to_body_m21=0
# 旋转矩阵第 2 行第 2 列。
camera_to_body_m22=1

# 姿态校准与可选发射触发参数；触发前非静止样本保持姿态，不做陀螺传播。
# 静止校准允许的比力模长相对重力最大偏差，单位：m/s²。
attitude_stationary_acceleration_tolerance_mps2=0.25
# 静止判定时角速度模长的最大值，单位：rad/s。
attitude_gyro_stationary_threshold_rad_s=0.05
# 静止阶段陀螺仪零偏 EMA 系数。
attitude_gyro_bias_filter_alpha=0.02
# 连续静止段内重力矢量 EMA 系数，范围 (0, 1]；扰动后重新初始化。
attitude_accel_filter_alpha=0.02
# 静止姿态确认时长，单位：ms，至少 200；确认前不更新姿态和基线。
attitude_stationary_confirm_ms=200
# 启动时选择触发方案（不支持运行中热切换）；缺省 acceleration，当前配置采用 two_stage。
# acceleration：持续加速达到确认时间即触发；two_stage：加速确认后还需低比力离架确认。
# 两种模式共用当前标定、异常保护和触发后积分，不切换重力补偿公式。
launch_detection_mode=two_stage
# 相对静止基线的 X 轴加速度增量阈值，单位：m/s²（1.5g）；两种模式共用。
launch_ax_threshold_mps2=14.709975
# X 轴加速度持续超过阈值的确认时间，单位：ms。
launch_confirm_ms=20
# 以下三项仅由 two_stage 使用；所有模式均校验其配置，以便切换后仍然有效。
# 加速确认后，比力模长低于此上限才视为离架候选，单位：m/s²；必须低于静止校准区间。
launch_release_acceleration_max_mps2=3
# 低比力连续确认时间，单位：ms；确认后才允许制导，下一连续有效帧开始姿态/速度积分。
launch_release_confirm_ms=10
# 加速确认后等待离架的最长时间，单位：ms；须大于低比力确认时间，超时要求重新静止校准。
launch_release_timeout_ms=500
# IMU 连续性的最大样本间隔，单位：ms；断流取消候选，不跨断流或无效样本积分。
attitude_maximum_gap_ms=20
# true 表示加速度计输出为比力；false 表示输出为重力加速度方向。
accelerometer_specific_force=true

# 导引先扣除自然抛物线角速率；输出端不再额外补偿重力。
# 导航系数作用于补偿后 LOS 角速度的弹道系 Y 方向。
png_navigation_constant_y=3
# 导航系数作用于 LOS 空间角速度投影后的弹道系 Z 方向。
png_navigation_constant_z=3
# 唯一重力配置，共用于姿态/速度、弹道导引与输出映射，单位 m/s²。
png_gravity=9.80665
# 镖体系通道选择后的合成指令过载上限，单位：g。
png_maximum_command_overload=0.3
# 发送端最终指令比力上限，单位 m/s²；inf 禁用此项限制，0 严格清零。
png_maximum_command_acceleration=9.80665

# 调试模式：disabled（正常PNG制导）、launch_delay（发射确认后延迟触发）、target_detected（首次未过期的发射后识别触发）。
# 两种固定模式均使用 IMU 发射状态；触发前发射位随 IMU、识别位为 0、过载为零，保持下位机原上升流程。
debug_mode=disabled
# launch_delay 从当前代际的 IMU 发射确认时间计时，无需视觉识别；触发延迟单位：毫秒。
debug_trigger_delay_ms=200
# 镖体系 yaw 轴固定过载指令，单位：g。
debug_yaw_g=0.0
# 镖体系 pitch 轴固定过载指令，单位：g。
debug_pitch_g=0.0
# 调试固定指令持续时间，单位：毫秒；0 表示触发后持续发送至运行结束。
debug_duration_ms=0

[output]
# 输出模式互斥：rtsp 只推流，debug 连续保存，match 在起飞后缓存窗口并保存。
mode=match
# debug/match 的录像基础路径；相对路径相对于本配置文件目录。
# 每次程序运行会在同目录创建带时间编号的文件夹，存放本次所有视频、逐帧 CSV 和全程 IMU CSV。
# 路径为空时使用 recordings/mosas_guidance.avi。
recording_path=recordings/mosas_guidance.avi
# 是否在视频帧中绘制目标框、目标状态、视线角和制导数据。
draw_visualization=true
# 起飞窗口时长，单位：ms。默认 10 秒；帧率使用上方相机 fps，大小受 BGR 内存上限限制。
match_window_duration_ms=4000

[wireless]
# RTSP 推流地址。
rtsp_url=rtsp://192.168.137.1:8554/mosas
# RTP 传输方式，支持 tcp 或 udp。
rtsp_transport=tcp
# RTSP 视频宽度，单位：像素。
width=640
# RTSP 视频高度，单位：像素。
height=480
# RTSP 输出帧率，单位：帧/秒。
fps=30
# H.264 视频码率，单位：bit/s。
bitrate=2000000
# GOP 长度，单位：帧。
gop_size=30
# RTSP 建连和网络 I/O 超时时间，单位：毫秒。
rtsp_timeout_ms=5000
# 可选的 FFmpeg H.264 编码器名称；不填写时使用默认编码器。
